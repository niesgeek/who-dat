openapi: 3.1.0
info:
  title: wi.fs.kg
  description: >
    Normalized WHOIS and RDAP lookup served at https://wi.fs.kg.
    Returns one consistent shape for every TLD.
    RDAP is used where available, with a port-43 WHOIS fallback. Append `?raw=true`
    to any lookup to get the original upstream payload.
  version: 2.0.0
  license:
    name: MIT
    url: https://github.com/niesgeek/who-dat/blob/HEAD/LICENSE
servers:
  - url: https://wi.fs.kg
    description: Production
  - url: /
    description: This deployment
paths:
  /v1/whois/{domain}:
    get:
      summary: Look up a domain
      description: Canonical, versioned lookup endpoint.
      operationId: lookup
      parameters:
        - $ref: "#/components/parameters/Domain"
        - $ref: "#/components/parameters/Raw"
      responses:
        "200":
          description: Lookup succeeded (whether or not the domain is registered).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Result" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /{domain}:
    get:
      summary: Look up a domain (bare convenience route)
      operationId: lookupBare
      parameters:
        - $ref: "#/components/parameters/Domain"
        - $ref: "#/components/parameters/Raw"
      responses:
        "200":
          description: Lookup succeeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Result" }
        "405": { $ref: "#/components/responses/Error" }
  /multi:
    get:
      summary: Look up multiple domains
      operationId: lookupMulti
      parameters:
        - name: domains
          in: query
          required: true
          description: Comma-separated list of domains.
          schema: { type: string }
      responses:
        "200":
          description: Per-domain results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/Result" }
  /api/whoami:
    get:
      summary: Connection facts for this request
      description: >
        Reads the visitor address and headers the platform already attached
        (Vercel geolocation and edge region, or the TLS session if this
        process terminated it). ASN, ISP, and the visitor TLS version are
        returned empty when the platform did not send them. This route does
        not call a location or ASN service. `Cache-Control` is `no-store`.
        `unavailable` lists the fields that stayed empty for that reason.
      operationId: whoami
      responses:
        "200":
          description: Connection snapshot. asn is null when the platform omitted it.
  /api/dns:
    get:
      summary: Query one DNS name
      description: >
        Asks a public resolver or authoritative server from this process.
        curl and wget receive dig-style text. Browsers and
        `Accept: application/json` receive JSON. `format=text` or
        `format=json` overrides that. Responses are `Cache-Control: no-store`.
        Server addresses must be public. ANY and AXFR are rejected.
      operationId: dnsQuery
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string, example: example.com }
          description: Hostname, underscore name, wildcard, or IP (rewritten to a reverse name).
        - name: type
          in: query
          schema: { type: string, default: A, example: A }
          description: A, AAAA, CNAME, MX, TXT, NS, SOA, CAA, SRV, PTR, DS, DNSKEY, or RRSIG.
        - name: server
          in: query
          schema: { type: string, default: 8.8.8.8 }
          description: Public resolver IP or hostname. Defaults to DNS_SERVER or 8.8.8.8.
        - name: dnssec
          in: query
          schema: { type: string, default: "1" }
          description: Set the EDNS DO bit unless this is 0, false, no, or off.
        - name: rd
          in: query
          schema: { type: string, default: "1" }
          description: Recursion desired. Use 0 when asking an authoritative server.
        - name: timeout
          in: query
          schema: { type: integer, default: 4000, minimum: 200, maximum: 8000 }
          description: Per-query budget in milliseconds.
        - name: format
          in: query
          schema: { type: string, enum: [json, text] }
      responses:
        "200":
          description: DNS response. JSON for browsers, text for curl.
        "400": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /api/dns/lab:
    get:
      summary: DNS laboratory report
      description: >
        Records for the common types, a propagation matrix, per-server SOA
        serials, parent versus child NS names, and a DNSSEC presence check.
        `cryptoValidation` is always false. A complete chain is not a
        validated signature.
      operationId: dnsLab
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string, example: example.com }
        - name: type
          in: query
          schema: { type: string, default: ALL }
      responses:
        "200":
          description: Laboratory report as JSON.
  /api/price:
    get:
      summary: Reference prices for a suffix
      description: >
        Cheapest public registrar list price per step (register, renew,
        transfer) for one suffix, from nazhumi.com's public price API, with
        the cheapest row's coupon detail. Prices are snapshots, not live
        quotes, and the three steps usually come from three different
        registrars. Cached server-side for 5 minutes.
      operationId: priceForSuffix
      parameters:
        - name: tld
          in: query
          required: true
          schema: { type: string, example: com }
          description: Suffix without the leading dot; may also be a bare TLD of a second-level suffix such as co.fo.
      responses:
        "200":
          description: Price snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /health:
    get:
      summary: Health check
      operationId: health
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
components:
  parameters:
    Domain:
      name: domain
      in: path
      required: true
      description: A domain name, hostname, or URL. The registrable domain is extracted.
      schema: { type: string, example: example.com }
    Raw:
      name: raw
      in: query
      required: false
      description: When true, returns the original RDAP JSON or WHOIS text.
      schema: { type: boolean }
  responses:
    Error:
      description: Error envelope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: INVALID_DOMAIN, description: "Error code. PLATFORM_NAMESPACE means the name lives in a platform namespace (for example DNSHE or FurryBox) and the registry holds no record for it; see platform for where to look instead." }
            message: { type: string }
            query: { type: string }
            source: { type: string, enum: [rdap, whois], description: Lookup backend that failed, when known. }
            server: { type: string, description: Upstream server queried, when known. }
            detail: { type: string, description: Underlying error detail, for diagnostics. }
            platform:
              type: object
              description: Present only with PLATFORM_NAMESPACE.
              properties:
                name: { type: string, example: DNSHE }
                url: { type: string, example: "https://www.dnshe.com/" }
                suffix: { type: string, example: cc.cd }
                hasLookup: { type: boolean, description: Whether the platform publishes a public lookup. }
    Result:
      type: object
      properties:
        query: { type: string }
        domain: { type: string }
        domainUnicode: { type: [string, "null"] }
        id: { type: [string, "null"] }
        tld: { type: string }
        isRegistered: { type: boolean }
        registrar:
          type: object
          properties:
            name: { type: [string, "null"] }
            ianaId: { type: [string, "null"] }
            url: { type: [string, "null"] }
            whoisServer: { type: [string, "null"] }
            abuseEmail: { type: [string, "null"] }
            abusePhone: { type: [string, "null"] }
            reseller: { type: [string, "null"] }
        status:
          type: array
          items: { type: string }
        nameservers:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              ipv4: { type: array, items: { type: string } }
              ipv6: { type: array, items: { type: string } }
        dnssec:
          type: object
          properties:
            signed: { type: boolean }
            dsData: { type: array, items: { type: object } }
        dates:
          type: object
          properties:
            created: { type: [string, "null"], format: date-time }
            updated: { type: [string, "null"], format: date-time }
            expires: { type: [string, "null"], format: date-time }
        events:
          type: array
          description: Full chronological event list from the upstream (registration, last changed, transfer, expiration, last update of RDAP database, …). Dates are derived from this list; it is not truncated to the three dates above.
          items:
            type: object
            properties:
              action: { type: string, example: registration }
              date: { type: string, format: date-time }
        contacts:
          type: object
          properties:
            registrant: { $ref: "#/components/schemas/Contact" }
            admin: { $ref: "#/components/schemas/Contact" }
            tech: { $ref: "#/components/schemas/Contact" }
            billing: { $ref: "#/components/schemas/Contact" }
        meta:
          type: object
          properties:
            source: { type: string, enum: [rdap, whois] }
            server: { type: [string, "null"] }
            fetchedAt: { type: string, format: date-time }
            cached: { type: boolean }
            durationMs: { type: integer, description: Milliseconds the upstream lookup took. }
            statusCode: { type: integer, description: Upstream HTTP status (RDAP), when known. }
            bytes: { type: integer, description: Size of the upstream payload in bytes. }
            conformance: { type: array, items: { type: string }, description: RDAP conformance classes from the response, when known. }
    Contact:
      type: object
      properties:
        name: { type: [string, "null"] }
        organization: { type: [string, "null"] }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        address:
          type: object
          properties:
            street: { type: [string, "null"] }
            city: { type: [string, "null"] }
            state: { type: [string, "null"] }
            postalCode: { type: [string, "null"] }
            country: { type: [string, "null"] }
        redacted: { type: boolean }
    PriceResponse:
      type: object
      properties:
        ok: { type: boolean }
        tld: { type: string, example: com }
        source: { type: string, example: nazhumi.com }
        sourceUrl: { type: string, description: "Link to the source suffix page, for attribution." }
        fetchedAt: { type: string, format: date-time }
        updated: { type: [string, "null"], description: "Collection time of the newest row used, as recorded upstream." }
        total: { type: integer, description: "Number of price rows returned upstream for this suffix." }
        items:
          type: array
          items:
            type: object
            properties:
              order: { type: string, enum: [register, renew, transfer] }
              empty: { type: boolean, description: "True when the upstream lists no price for this step." }
              standardCny: { type: [number, "null"], description: "List price in CNY, without a coupon." }
              origValue: { type: [number, "null"], description: "List price in the registrar's own currency." }
              currency: { type: [string, "null"] }
              effectiveCny: { type: [number, "null"], description: "Cheapest effective CNY price (coupon applied when one exists)." }
              registrarCode: { type: [string, "null"] }
              registrarName: { type: [string, "null"] }
              registrarWeb: { type: [string, "null"] }
              updatedtime: { type: [string, "null"], description: "Collection time of this row, as recorded upstream." }
              promo:
                type: object
                properties:
                  code: { type: [string, "null"] }
                  priceCny: { type: [number, "null"] }
                  limit: { type: integer, description: "Remaining coupon uses, when the upstream reports it." }
                  newUser: { type: boolean }
                  end: { type: [string, "null"], description: "Coupon expiry, as recorded upstream." }
