<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F5EFE1" />
    <meta name="color-scheme" content="light" />
    <script>
      (function () {
        var mode = "auto";
        var prefersDark = false;
        try {
          var raw = localStorage.getItem("whois-ui-theme");
          if (raw === "light" || raw === "dark" || raw === "auto") mode = raw;
        } catch (e) {}
        try { prefersDark = matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
        var dark = mode === "dark" || (mode !== "light" && prefersDark);
        var root = document.documentElement;
        root.setAttribute("data-theme", dark ? "dark" : "light");
        root.setAttribute("data-theme-mode", mode);
        var color = document.querySelector('meta[name="theme-color"]');
        if (color) color.setAttribute("content", dark ? "#12110e" : "#F5EFE1");
        var scheme = document.querySelector('meta[name="color-scheme"]');
        if (scheme) scheme.setAttribute("content", dark ? "dark" : "light");
      })();
    </script>
    <meta name="description" content="wi.fs.kg WHOIS and RDAP API reference." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wi.fs.kg/docs" />
    <meta property="og:title" content="wi.fs.kg — WHOIS API" />
    <meta property="og:description" content="Normalized WHOIS and RDAP lookup at https://wi.fs.kg." />
    <link rel="canonical" href="https://wi.fs.kg/docs" />
    <title>wi.fs.kg — WHOIS API</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html, body { background: #f5efe1; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #12110e; }
      .theme-switch {
        position: fixed;
        z-index: 80;
        top: 8px;
        right: 452px;
        display: inline-flex;
        align-items: center;
        gap: 2px;
        padding: 3px;
        background: #fffdf6;
        color: #141210;
        border: 2px solid #141210;
        border-radius: 999px;
        box-shadow: 3px 3px 0 #141210;
        line-height: 1;
        font-family: "Space Grotesk", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      }
      html[data-theme="dark"] .theme-switch {
        background: #1a1815;
        color: #f4efe6;
        border-color: #f4efe6;
        box-shadow: 3px 3px 0 #f4efe6;
      }
      .theme-switch button {
        appearance: none;
        position: relative;
        border: 2px solid transparent;
        background: transparent;
        color: inherit;
        font: inherit;
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        line-height: 1;
        padding: 5px 8px;
        border-radius: 999px;
        cursor: pointer;
      }
      .theme-switch button[aria-pressed="true"] {
        background: #cbf36b;
        color: #141210;
        border-color: #141210;
      }
      html[data-theme="dark"] .theme-switch button[aria-pressed="true"] {
        background: #d6ff4a;
        border-color: #f4efe6;
      }
      .theme-short { display: none; }
      .theme-short svg { display: block; }
      @media (max-width: 1040px) {
        .theme-switch { top: auto; bottom: 16px; right: 14px; }
      }
      @media (max-width: 720px) {
        .theme-switch .theme-full {
          position: absolute;
          width: 1px;
          height: 1px;
          padding: 0;
          margin: -1px;
          overflow: hidden;
          clip: rect(0 0 0 0);
          white-space: nowrap;
          border: 0;
        }
        .theme-switch .theme-short { display: grid; }
      }
    </style>
  </head>
  <body>
    <div class="theme-switch" id="themeSwitch" role="group" aria-label="Theme">
      <button type="button" data-theme-choice="auto" aria-pressed="true">
        <span class="theme-full">Auto</span>
        <span class="theme-short" aria-hidden="true"><svg viewBox="0 0 16 16" width="13" height="13"><circle cx="8" cy="8" r="5.25" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path fill="currentColor" d="M8 2.75a5.25 5.25 0 0 0 0 10.5z"></path></svg></span>
      </button>
      <button type="button" data-theme-choice="light" aria-pressed="false">
        <span class="theme-full">Light</span>
        <span class="theme-short" aria-hidden="true"><svg viewBox="0 0 16 16" width="13" height="13"><circle cx="8" cy="8" r="2.3" fill="currentColor"></circle><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.2 3.2l1.4 1.4M11.4 11.4l1.4 1.4M12.8 3.2l-1.4 1.4M4.6 11.4l-1.4 1.4"></path></g></svg></span>
      </button>
      <button type="button" data-theme-choice="dark" aria-pressed="false">
        <span class="theme-full">Dark</span>
        <span class="theme-short" aria-hidden="true"><svg viewBox="0 0 16 16" width="13" height="13"><path fill="currentColor" d="M9.4 1.7a5.5 5.5 0 1 0 4.8 8.1A4.5 4.5 0 1 1 9.4 1.7z"></path></svg></span>
      </button>
    </div>
    <script id="api-reference" data-url="/openapi.yaml"></script>
    <script>
      (function () {
        var el = document.getElementById("api-reference");
        if (!el) return;
        var theme = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
        var mode = document.documentElement.getAttribute("data-theme-mode") || "auto";
        try { localStorage.setItem("colorMode", mode === "auto" ? "system" : theme); } catch (e) {}
        el.setAttribute("data-configuration", JSON.stringify({
          hideDarkModeToggle: true,
          customCss: [
            ".dark-mode.dark-mode {",
            "  --scalar-background-1: #12110e;",
            "  --scalar-background-2: #1c1a16;",
            "  --scalar-background-3: #26231e;",
            "  --scalar-color-1: #f4efe6;",
            "  --scalar-color-2: #cfc6b6;",
            "  --scalar-color-3: #9c9488;",
            "  --scalar-color-accent: #d6ff4a;",
            "  --scalar-background-accent: rgba(214, 255, 74, 0.16);",
            "  --scalar-border-color: #5a5046;",
            "  --scalar-button-1: #d6ff4a;",
            "  --scalar-button-1-color: #141210;",
            "  --scalar-button-1-hover: #e7ff86;",
            "}"
          ].join("\n")
        }));
      })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script src="/theme.js"></script>
  </body>
</html>
